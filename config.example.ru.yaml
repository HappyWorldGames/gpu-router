# gpu-router: пример конфигурации. Скопируйте в config.yaml и поправьте под себя.
# Запуск: ./gpu-router /путь/к/config.yaml   (без аргумента читается ./config.yaml)

comfyui:
  host: "127.0.0.1"
  port: "8288"                # порт самого ComfyUI (клиенты ходят на proxy.comfyui_port)
  # Имя systemd-юнита (systemctl list-units | grep -i comfy). По нему прокси находит
  # процессы сервиса на GPU и, если сервис не отпускает VRAM, выбивает их.
  unit: "comfyui.service"
  # Сколько VRAM сервис вправе удерживать ПОСЛЕ выгрузки (CUDA-контекст и т.п.).
  # Больше этого = утечка. Подберите по строке "остаток N МБ" в логе.
  residual_mb: 2048
  # Через сколько секунд простоя выгружать модели ComfyUI, не дожидаясь, пока GPU
  # понадобится llama. 0 = выгружать только при передаче GPU.
  idle_release: 20

llama:
  host: "127.0.0.1"
  port: "8180"                # порт llama-server (router); клиенты ходят на proxy.llama_port
  unit: "llama.service"       # юнит llama-server; модели-дети лежат в его cgroup
  residual_mb: 512
  idle_release: 0             # 0 = модель остаётся в VRAM, пока GPU не понадобится ComfyUI
  # Путь к models.ini llama.cpp. Из него берётся parallel каждой модели (с учётом секции [*]):
  # столько запросов к уже загруженной модели прокси пускает одновременно.
  # Читается один раз при старте. Пусто = параллельные запросы выключены.
  models_ini: ""              # например "/etc/llama/models.ini"

proxy:
  comfyui_port: 8188
  llama_port: 8080
  # На каком адресе слушать. "" = все интерфейсы. Если клиенты работают в Docker и ходят
  # через host.docker.internal, "127.0.0.1" их отрежет. Тогда оставьте "" и закройте порты
  # файрволом от внешней сети: у прокси нет собственной авторизации.
  listen_host: ""

queue:
  max_size: 30
  wait_timeout: 10800          # сколько задача может ждать своей очереди
  poll_interval: 5
  comfy_idle_timeout: 10800    # макс. время генерации ComfyUI; дальше — прерывается/выбивается
  # Эти два предела срабатывают только когда за задачей кто-то ждёт: пока очередь пуста,
  # запрос может идти сколько угодно.
  exec_idle_timeout: 300       # нет данных от бэкенда столько секунд — обрыв запроса
  task_timeout: 14400          # потолок на одну задачу, чтобы очередь не вставала

gpu:
  release_timeout: 30          # сколько ждать мягкой выгрузки, потом SIGKILL
  watchdog_interval: 2         # период проверки конфликтов VRAM, сек
  restart_wait: 180            # сколько ждать подъёма недоступного сервиса перед задачей
  # Оперативная память (у APU "VRAM" — это та же ОЗУ). Если MemAvailable ниже порога,
  # в лог пишется предупреждение со списком самых тяжёлых процессов, а задача ждёт
  # восстановления до mem_wait секунд (потом идёт на свой риск). -1 = не проверять.
  min_available_mb: 1024
  mem_wait: 20
  # Аварийная защита: если MemAvailable упал ниже этого значения (2 замера подряд),
  # прокси останавливает того, кто держит GPU: сначала мягко, через ~4 с без улучшения —
  # SIGKILL всем процессам его юнита. Быстрее и точечнее OOM-killer'а ядра. -1 = выключить.
  critical_available_mb: 512
  # То же, но когда GPU никому не нужен (нет задачи и очередь пуста): модель не выбиваем,
  # пока ОЗУ не упадёт ниже этого порога. 0 = половина critical_available_mb,
  # -1 = при простое не выбивать никогда (риск: жертву выберет OOM-killer ядра).
  critical_idle_available_mb: 0
  kill_on_leak: true           # false = только логировать, не убивать
  # Источник данных о VRAM: auto | fdinfo (AMD/Intel, из ядра, без утилит) | nvidia | none
  backend: "auto"
  nvidia_smi: "nvidia-smi"

# Страница состояния (см. раздел «Панель состояния» в README).
dashboard:
  port: 8190                   # -1 = выключить
  listen_host: "127.0.0.1"     # к нему ходит Caddy на этой же машине
  services:                    # что показывать в списке «Сервисы»; addr проверяется по TCP
    - { name: "Open WebUI", addr: "127.0.0.1:3000", url: "https://openwebui.home", desc: "Чат с моделями" }
    - { name: "ComfyUI",    addr: "127.0.0.1:8288", url: "https://comfyui.home",   desc: "Картинки и видео" }
    - { name: "llama.cpp",  addr: "127.0.0.1:8180", url: "",                       desc: "Сервер языковых моделей" }

logging:
  # false = «тихий» режим: только запуск, очередь ([Start]/[Done]), выгрузки/выбивание,
  # предупреждения и ошибки.
  verbose: true
  requests: true               # (при verbose: true) строки [ComfyUI REQ] / [LLAMA REQ]
  mem_trace: 0                 # (при verbose: true) раз в N сек срез ОЗУ/VRAM/GTT во время задачи; 0 = выкл
